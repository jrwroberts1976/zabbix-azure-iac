---
postgresql_version: 17
postgresql_pgdg_repository_enabled: "{{ ansible_distribution == 'Ubuntu' }}"
postgresql_pgdg_key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
postgresql_pgdg_key_path: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
postgresql_pgdg_repository_uri: https://apt.postgresql.org/pub/repos/apt
postgresql_packages:
  - acl
  - "postgresql-{{ postgresql_version }}"
  - "postgresql-client-{{ postgresql_version }}"
  - python3-psycopg2
postgresql_service_name: postgresql
postgresql_listen_addresses: localhost
postgresql_port: 5432
postgresql_databases: []
postgresql_users: []
postgresql_hba_rules: []
